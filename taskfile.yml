version: '3'

tasks:
  default:
    cmds:
      - task --list-all
  update:
    cmds:
      - python scripts/update.py
  build:
    cmds:
      - wget -O cache/themes.json $(cat private/ivs_url)
      - python scripts/merge.py
      - uv run scripts/build_json.py
      - uv run scripts/build_mp4.py
  deploy:
    dir: build
    cmds:
      - git add data.json
      - git add thumbnail.mp4
      - git commit --amend --no-edit
      - git -c core.sshCommand="ssh -i ../private/ssh/id_ed25519 -F /dev/null" push -f
